# sha256 of this block is recorded in badf/current-state.json and any later
# edit - a character of prose included - is refused. The markers are part of
# the grammar, not decoration: a record with no frozen block can never be
# frozen, so it is refused outright.
act_id: BOOTSTRAP-001
state: SEATED
established_by: OPERATOR_INSTRUCTION_ADOPTING_THE_SUCCESSION_RULE
standing_authority_path: false
instruction_date: "2026-09-30"
