  THE OPERATOR INSTRUCTION RECORDED HERE IS THE MECHANISM THAT ADOPTED THE
  SUCCESSION RULE IN badf/agents.yaml. IT IS NOT A STANDING ALTERNATIVE
  AUTHORITY PATH, AND IT IS SPENT BY ITS OWN USE.
