# The record of the one-time external act that seats the first occupant of a
# human-only seat, and of the succession rule that act adopts.
#
# WHY THIS FILE EXISTS. badf/agents.yaml routes changes to itself to
# `verifier: repository-administrator`, so filling that seat required the seat
# to verify its own creation. The same seat owns
# badf/signing-policy.yaml and AGENTS.md. No agent may break that loop:
# badf/authority.yaml tool_authority.may_not forbids an agent to "Grant, extend
# or infer authority, including its own", and a rule deciding who may seat an
# authority is a rule about authority.
#
# docs/decisions/PROPOSAL-bootstrap-seating.md costs four ways out and
# recommends (a) adopted once by (c): an out-of-band operator instruction that
# seats the first administrator AND, in the same act, adopts the succession
# rule now written into badf/agents.yaml, so that no further out-of-band
# instruction is ever needed. This file is the record of that act.
#
# WHAT THIS FILE WAS, AND IS NOW. It shipped as the SHAPE of a seating, with the
# principal absent, and scripts/validate_continuity.py refused it as a completed
# seating until an operator named one. On 2026-09-30 the operator did, in
# session: "Name: BizEra as the Project Owner" (DEC-036, badf/decision-log.jsonl).
# The state below is now SEATED. An agent supplied no name: the repository's git
# identity is a fact about a machine, not a decision about who holds an office,
# and an agent writing a human into a seat is the forgery this repository exists
# to refuse.
#
# THIS SEATING IS CONTESTED. The independent review of BIZTRUST-WP-001 (issue 8,
# finding B6) found that "BizEra" is also the git identity earlier agent commits
# used, so the record alone cannot tell this seating from that forgery, and that
# the succession rule's first-fill verification by a different human seat has not
# happened. The finding is open, and it is the operator's decision (D2 on issue 8).
#
# THE FIVE PROPERTIES THE VALIDATOR ENFORCES, not merely documents:
#
#   1. NO PERSISTENT BYPASS. The capability is single-use and is consumed by
#      its own use. badf/current-state.json records which act was spent and on
#      which seats, but that ledger is DATA and edits as easily as this file
#      does, so it is not what makes the act single-use. The pins are:
#      scripts/validate_continuity.py fixes BOOTSTRAP-001 as the only act, SEATED
#      as its state, exactly `repository-administrator` as the seat it seated,
#      and the sha256 of the frozen block below. A second act, another seat, or
#      a rewritten record is refused even when this file, badf/agents.yaml and
#      the ledger are edited to agree. A legitimate later change is therefore a
#      reviewed change to that validator, not a data edit.
#   2. NON-SELF-AMENDING. The seat this record seats may not be the owner or
#      the verifier of the routing entry for this file. The administrator this
#      act creates cannot rewrite the record that created its authority.
#   3. (c) ESTABLISHED (a). established_by and the statement below say, in
#      terms no later reader can mistake, that the operator instruction was the
#      MECHANISM that adopted the succession rule - not a standing parallel
#      authority path that remains available afterwards.
#   4. DECLARED SEPARATION = ACTUAL SEPARATION. One principal in two seats is
#      legal only as a declared, expiring exception. A declaration without the
#      dual seat, or a dual seat without the declaration, is refused.
#   5. DETERMINISTIC SUCCESSION. The next vacancy needs no operator
#      instruction: badf/agents.yaml `succession:` decides it, and this record
#      is the act that adopted that rule.
#
# HOW A SEATING IS RECORDED, when an operator makes one:
#
#   - state: SEATED
#   - instruction_date / instruction_origin: filled in from the instruction
#   - the seating's principal: the named human
#   - badf/agents.yaml: that seat's held_by set to the SAME name
#   - badf/current-state.json bootstrap: state SEATED, act_id, seats, and
#     historical_digest set to the sha256 of the frozen block below
#
# All six change together or the validator refuses the set. That is deliberate,
# but it is not what stops a second seating: a forger can make three files
# agree, and no signature binds any of them while badf/signing-policy.yaml
# enrols no key. What stops one is the pin in the validator, described above.

version: "0.1.0"
updated_at: "2026-09-30T00:00:00Z"

# ---- BEGIN HISTORICAL RECORD ----
# Everything between these two markers is hashed. Once state is SEATED the
# sha256 of this block is recorded in badf/current-state.json and any later
# edit - a character of prose included - is refused. The markers are part of
# the grammar, not decoration: a record with no frozen block can never be
# frozen, so it is refused outright.
act_id: BOOTSTRAP-001
state: SEATED
established_by: OPERATOR_INSTRUCTION_ADOPTING_THE_SUCCESSION_RULE
standing_authority_path: false
instruction_date: "2026-09-30"
instruction_origin: "operator instruction in a Claude Code session, recorded by an agent - verbatim text in DEC-036"
