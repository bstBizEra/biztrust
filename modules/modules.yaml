# The module registry.
#
# This file is the ONE list of modules. The boundary rule, the schema list and
# the migration lint are generated from it, so a module that is not registered
# here cannot import, be imported, or own a table.
#
# Source of the initial rows: BIZTRUST-ARCH-001 section 6, "Capability map",
# whose candidate modules are grouped platform / brokerage / financial /
# integration. The contract says that list "must not be used to justify
# premature service extraction"; it is used here only as a list of boundaries
# to test. Whether a candidate is a bounded context, a subdomain or an
# aggregate is the BIZTRUST-DOMAIN-001 decision (guide issue #113), not the
# decision of this file.
#
# Fields, per the P0.2 design, "The module registry":
#   name        package name @biztrust/<name>; also the PostgreSQL schema name
#               with hyphens as underscores
#   group       platform | brokerage | financial | integration
#   owner_role  the role that answers for the module contract and schema
#   contract    the module public entry; the only path another package may
#               import
#   schema      the PostgreSQL schema the module owns, or "none" for a module
#               with no persisted state
#   epic        the epic whose design fills the module; null means the row is a
#               registry entry and nothing else
#   source      "contract" for a candidate module of the capability map, or the
#               design that introduced the module
#   package     true when a package directory exists under modules/
#
# No module, package or path is ever named for a tenant. Tenant variation is
# configuration under ADR-011; a tenant name in this registry is a review
# finding.

version: "0.1.0"
generated_from: "modules/modules.yaml"

