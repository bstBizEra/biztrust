# The one workspace. P0.2 design, "The workspace":
# a workspace must have a pnpm-workspace.yaml file in its root, and local
# packages depend on each other through the workspace protocol.
# https://pnpm.io/workspaces
packages:
  - "apps/*"
  - "services/*"
  - "modules/*"
  - "packages/*"

# A transitive dependency held at its first patched version (GHSA-hrr3-gc8f-f4qj,
# patched in 3.1.8), which is inside the major ajv asks for. fast-uri arrives
# through dependency-cruiser > ajv, a dev dependency that reads only this
# repository's own configuration, so the exposure is small; the override keeps
# `pnpm audit` clean rather than carrying a known advisory. It is an EXACT
# version, not a range (round ten, security S-8): a caret range would float to
# any later 3.x the next time the lockfile is regenerated, and an override that
# moves on its own is a dependency decision nobody made. Remove it when
# dependency-cruiser takes a release whose ajv range already resolves to 3.1.8
# or later. This override is a dependency decision taken by an agent: see DEC-040.
overrides:
  fast-uri: "3.1.8"
